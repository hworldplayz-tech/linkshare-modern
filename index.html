<!doctype html>
<html lang="en">
  <head>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        if (!msg || msg === 'Script error.' || String(msg).includes('Script error')) {
          return true;
        }
      };
      window.addEventListener('error', function(event) {
        if (!event.message || event.message === 'Script error.' || String(event.message).includes('Script error')) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (!event.reason.message || event.reason.message === 'Script error.' || String(event.reason.message).includes('Script error'))) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
